<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meteorites near my school</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #111; font-family: system-ui, sans-serif; }
    #map, #canvas-holder { position: absolute; inset: 0; }
    #canvas-holder { pointer-events: none; }
    #panel {
      position: absolute; top: 12px; left: 12px; width: 290px; max-height: calc(100% - 24px);
      overflow-y: auto; padding: 12px 14px; box-sizing: border-box;
      background: rgba(20, 20, 28, 0.88); color: #eee; border-radius: 8px; font-size: 13px; line-height: 1.4;
    }
    #panel h1 { font-size: 15px; margin: 0 0 6px; }
    #panel p { margin: 6px 0; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    #results ol { margin: 6px 0 0; padding-left: 20px; }
    #tip {
      position: absolute; pointer-events: none; display: none; padding: 5px 8px;
      background: rgba(0, 0, 0, 0.85); color: #fff; border-radius: 4px; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="canvas-holder"></div>
  <div id="panel">
    <h1>Meteorites near my school</h1>
    <p>For a teacher asking: <em>which meteorites in the file are closest to our school?</em>
       Click the map to place your school. The 5 nearest meteorites are linked and listed.</p>
    <p><span class="dot" style="background:#ffb347"></span>Seen to fall &nbsp;
       <span class="dot" style="background:#4fd1ff"></span>Found later<br>
       Circle area follows mass.</p>
    <div id="results"></div>
  </div>
  <div id="tip"></div>
  <script src="libraries/p5.js" type="text/javascript"></script>
  <script src="meteorite-landing.js" type="text/javascript"></script>
</body>
</html>
